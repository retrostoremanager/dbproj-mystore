# Azure Pipeline for MyStore PostgreSQL Database
# This pipeline deploys PostgreSQL schema files
# Supports: dev and test environments

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - PostgreSQL/*

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - test

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Environment-specific variables
  - group: 'mystore-db-${{ parameters.environment }}'

stages:
- stage: Build
  displayName: 'Package PostgreSQL Scripts'
  jobs:
  - job: Build
    displayName: 'Create Deployment Package'
    steps:
    - checkout: self
      displayName: 'Checkout code from GitHub'
      persistCredentials: true

    - script: |
        echo "Packaging PostgreSQL deployment scripts..."
        mkdir -p $(Build.ArtifactStagingDirectory)/postgres-deploy
        cp -r PostgreSQL/* $(Build.ArtifactStagingDirectory)/postgres-deploy/
      displayName: 'Copy PostgreSQL scripts'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish PostgreSQL Scripts'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/postgres-deploy'
        artifactName: 'postgres-scripts'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy PostgreSQL Schema to ${{ parameters.environment }}'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployPostgreSQL
    displayName: 'Deploy to PostgreSQL'
    environment: '${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: postgres-scripts
            displayName: 'Download PostgreSQL Scripts'

          - task: AzureCLI@2
            displayName: 'Deploy PostgreSQL Schema'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Installing PostgreSQL client..."
                sudo apt-get update
                sudo apt-get install -y postgresql-client
                
                echo "Deploying PostgreSQL schema..."
                export PGPASSWORD='$(postgresAdminPassword)'
                
                # Deploy each SQL file in order
                for sqlfile in $(Pipeline.Workspace)/postgres-scripts/*.sql; do
                  if [ -f "$sqlfile" ]; then
                    filename=$(basename "$sqlfile")
                    # Skip the deploy_all.sql file as we're running files individually
                    if [ "$filename" != "000_deploy_all.sql" ]; then
                      echo "Executing: $filename"
                      psql -h $(postgresServerName).postgres.database.azure.com \
                           -U $(postgresAdminUsername) \
                           -d $(postgresDatabaseName) \
                           -f "$sqlfile" \
                           -v ON_ERROR_STOP=1
                      
                      if [ $? -eq 0 ]; then
                        echo "✓ $filename deployed successfully"
                      else
                        echo "✗ Failed to deploy $filename"
                        exit 1
                      fi
                    fi
                  fi
                done
                
                echo "##[section]PostgreSQL Schema Deployment Complete - ${{ parameters.environment }}"
                echo "Server: $(postgresServerName).postgres.database.azure.com"
                echo "Database: $(postgresDatabaseName)"
