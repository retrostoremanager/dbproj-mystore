# Azure Pipeline for MyStore SQL Database
# This pipeline builds and deploys the SQL Database project using DACPAC
# Supports: development, QA, staging, and production environments

trigger:
  branches:
    include:
      - main
      - develop
      - qa
      - staging
  paths:
    include:
      - Tables/*
      - Schemas/*
      - MyStore.Database.sqlproj

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'development'
    values:
      - development
      - qa
      - staging
      - production

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  # Environment-specific variables - set these per environment in Azure DevOps variable groups
  # Variable groups: mystore-db-dev, mystore-db-qa, mystore-db-staging, mystore-db-prod
  - group: 'mystore-db-${{ parameters.environment }}'
  # Map branch to environment if parameter not provided
  - name: targetEnvironment
    value: ${{ coalesce(parameters.environment, variables['Build.SourceBranchName']) }}
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      value: 'production'
    ${{ elseif eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      value: 'staging'
    ${{ elseif eq(variables['Build.SourceBranch'], 'refs/heads/qa') }}:
      value: 'qa'
    ${{ else }}:
      value: 'development'

stages:
- stage: Build
  displayName: 'Build Database Project'
  jobs:
  - job: Build
    displayName: 'Build DACPAC'
    steps:
    - checkout: self
      displayName: 'Checkout code from GitHub'
      persistCredentials: true

    - task: MSBuild@1
      displayName: 'Build SQL Database Project'
      inputs:
        solution: 'MyStore.Database.sqlproj'
        platform: 'Any CPU'
        configuration: '$(buildConfiguration)'
        msbuildArguments: '/p:SqlServerVersion=Sql150 /p:TargetDatabaseName=$(sqlDatabaseName)'

    - task: CopyFiles@2
      displayName: 'Copy DACPAC to Artifacts'
      inputs:
        SourceFolder: '$(Agent.BuildDirectory)/s'
        Contents: '**/*.dacpac'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish DACPAC Artifact'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'dacpac'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy Database to ${{ variables.targetEnvironment }}'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployDatabase
    displayName: 'Deploy to Azure SQL'
    environment: '${{ variables.targetEnvironment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: SqlAzureDacpacDeployment@1
            displayName: 'Deploy DACPAC to Azure SQL Database'
            inputs:
              azureSubscription: '$(azureSubscription)'
              ServerName: '$(sqlServerName).database.windows.net'
              DatabaseName: '$(sqlDatabaseName)'
              SqlUsername: '$(sqlAdminUsername)'
              SqlPassword: '$(sqlAdminPassword)'
              DacpacFile: '$(Pipeline.Workspace)/dacpac/bin/$(buildConfiguration)/MyStore.Database.dacpac'
              AdditionalArguments: '/p:BlockOnPossibleDataLoss=false /p:CreateNewDatabaseIfNotExist=true'

          - task: AzureCLI@2
            displayName: 'Verify Database Deployment'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "##[section]Database Deployment Complete - ${{ variables.targetEnvironment }}"
                echo "SQL Server: $(sqlServerName).database.windows.net"
                echo "Database: $(sqlDatabaseName)"
                echo "Environment: ${{ variables.targetEnvironment }}"
